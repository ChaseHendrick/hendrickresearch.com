name: Sync research from Undeciphered-Texts

# Keeps /research/undeciphered/ current: reads docs/research-notes/research-feed.json from
# Undeciphered-Texts and commits src/research-data.json when it changed, which makes Vercel redeploy.
on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-research
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the research feed
        run: node scripts/sync-research.mjs
      - name: Commit if the feed changed
        run: |
          if git diff --quiet -- src/research-data.json; then echo "No change."; exit 0; fi
          git config user.name "Chase Hendrick"
          git config user.email "326338179+ChaseHendrick@users.noreply.github.com"
          git add src/research-data.json
          git commit -m "Sync the research feed from Undeciphered-Texts"
          git push
