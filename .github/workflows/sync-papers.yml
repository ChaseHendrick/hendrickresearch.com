name: Sync papers and research ledgers

# Keeps the paper list and the cipher research ledgers current: reads the paper registries of GENChase and
# Undeciphered-Texts (papers/papers.json) and Undeciphered-Texts' research feed, and commits
# src/papers-data.json and src/research-feed.json when they changed, which makes Vercel redeploy the site.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-papers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the paper registries
        run: node scripts/sync-papers.mjs
      - name: Read the research feed
        run: node scripts/sync-research.mjs
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- src/papers-data.json src/research-feed.json; then echo "No change."; exit 0; fi
          git config user.name "Chase Hendrick"
          git config user.email "326338179+ChaseHendrick@users.noreply.github.com"
          git add src/papers-data.json src/research-feed.json
          git commit -m "Sync the paper list and research ledgers"
          git push
